[project]
name = "curb"
version = "0.0.0"
description = "AI accessibility auditor that proposes verified WCAG fixes, scored by an eval harness."
readme = "README.md"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["services/api", "services/worker", "packages/shared"]

[tool.uv.sources]
curb-shared = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM", "PL"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["PLR2004", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_any_explicit = false
explicit_package_bases = true
namespace_packages = true
mypy_path = "services/api:services/worker:packages/shared"
files = ["services/api/curb_api", "services/worker/curb_worker", "packages/shared/curb_shared"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# Untyped third-party deps. Revisit if upstream ships py.typed markers.
module = [
    "asyncpg",
    "asyncpg.*",
    "sse_starlette",
    "sse_starlette.*",
    "pgvector.*",
    "fastembed",
    "fastembed.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# `evals` deliberately excluded — that suite is driven via `just eval` and the
# dedicated CI eval-gate step so a normal `pytest` run doesn't burn LLM quota.
testpaths = ["services", "packages"]
markers = [
    "slow: tests that take more than a few seconds (excluded from pre-push smoke)",
    "eval: golden-dataset eval cases (runs in just eval + CI eval-gate step)",
]
