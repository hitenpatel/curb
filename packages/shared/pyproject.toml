[project]
name = "curb-shared"
version = "0.0.0"
description = "Shared Pydantic models for Curb (violations, remediation, audit lifecycle)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["curb_shared"]
