name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # No `version:` input here — package.json's `packageManager` field is
      # the source of truth and pnpm/action-setup refuses to be told twice.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Python sync
        run: uv sync --all-packages

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Types (mypy)
        run: uv run mypy

      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium

      - name: Tests (pytest)
        run: uv run pytest -q

      - name: Frontend install
        run: pnpm --dir apps/web install --frozen-lockfile

      - name: Frontend check + build
        run: |
          pnpm --dir apps/web run check
          pnpm --dir apps/web run build

      # The eval gate lands with the harness in Phase 4. Until then the step
      # is a placeholder so the workflow shape is fixed and visible.
      - name: Eval gate (re-run-axe pass rate)
        if: hashFiles('evals/golden/**') != ''
        run: uv run deepeval test run evals/golden

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # The deploy key on the box is restricted to a single command, so the
      # 'ssh' call here is just a trigger; the box decides what runs. See
      # ~ubuntu/.ssh/authorized_keys on a11y.hiten.dev for the command= entry.
      - name: Deploy on the box
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_ed25519 "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" pull-and-up
