name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: curb
          POSTGRES_PASSWORD: curb
          POSTGRES_DB: curb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U curb -d curb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CURB_TEST_DATABASE_URL: postgresql://curb:curb@localhost:5432/curb
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # No `version:` input here — package.json's `packageManager` field is
      # the source of truth and pnpm/action-setup refuses to be told twice.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Python sync
        run: uv sync --all-packages

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Types (mypy)
        run: uv run mypy

      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium

      - name: Apply schema + ingest corpus into test DB
        env:
          DATABASE_URL: ${{ env.CURB_TEST_DATABASE_URL }}
        run: |
          # Apply schema via psql so retrieval tests have wcag_chunks ready.
          PGPASSWORD=curb psql -h localhost -U curb -d curb -f services/api/curb_api/db/schema.sql
          uv run python -m corpus.ingest

      - name: Tests (pytest)
        run: uv run pytest -q

      - name: Frontend install
        run: pnpm --dir apps/web install --frozen-lockfile

      - name: Frontend check + build
        run: |
          pnpm --dir apps/web run check
          pnpm --dir apps/web run build

      # Primary metric: re-run-axe pass rate over the golden dataset.
      # Skipped cleanly when MODEL_API_KEY isn't set (free-tier keys can
      # also rate-limit; transient errors are inconclusive, not fail).
      - name: Eval gate (re-run-axe pass rate)
        if: hashFiles('evals/golden/**') != ''
        env:
          MODEL_PROVIDER: google-gla
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          CURB_EVAL_SUITE: golden
          CURB_TEST_DATABASE_URL: ${{ env.CURB_TEST_DATABASE_URL }}
        run: uv run pytest evals -q

      - name: Upload eval summary
        if: always() && hashFiles('evals/.last-run.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: eval-summary
          path: evals/.last-run.md

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # The deploy key on the box is restricted to a single command, so the
      # 'ssh' call here is just a trigger; the box decides what runs. See
      # ~ubuntu/.ssh/authorized_keys on a11y.hiten.dev for the command= entry.
      - name: Deploy on the box
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_ed25519 "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" pull-and-up
