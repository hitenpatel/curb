[project]
name = "curb-worker"
version = "0.0.0"
description = "Curb audit worker: Playwright + axe detection, retrieval, remediation agent, scoring."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9.0",
    "asyncpg>=0.30.0",
    "redis[hiredis]>=5.2.0",
    "playwright>=1.49.0",
    "structlog>=24.4.0",
    "curb-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["curb_worker"]
