[project]
name = "curb-api"
version = "0.0.0"
description = "Curb FastAPI service: audit lifecycle, SSE streaming, model gateway."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "curb-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["curb_api"]
